services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/teampulse
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deploy}
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy
    command: sh -c "node src/seed.js && node src/index.js"
  web:
    build: ./client
    environment:
      VITE_API_URL: http://localhost:4000/api
    ports:
      - "5173:5173"
    depends_on:
      - api
volumes:
  mongo_data:
